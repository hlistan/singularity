name: Bug report
description: Something in the plugin, a pipeline or a workflow misbehaves
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Plugin commit and Claude Code version
      placeholder: "abc1234 · claude 2.1.x"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the command (e.g. /singularity:feature …) and the stage. Redact anything private.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed credentials, personal data, internal hostnames and private repository names from this report
          required: true
