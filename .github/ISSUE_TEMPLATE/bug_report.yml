name: Bug report
description: Something in the plugin, a pipeline or a workflow misbehaves
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Plugin version and Claude Code version
      description: "`claude plugin list` shows the plugin version. For a --plugin-dir checkout, give the commit instead."
      placeholder: "0.1.0 · claude 2.1.x"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the command (e.g. /singularity:feature …) and the stage. Redact anything private.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed credentials, personal data, internal hostnames and private repository names from this report
          required: true
