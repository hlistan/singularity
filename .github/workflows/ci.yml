name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate JSON
        run: |
          set -e
          git ls-files '*.json' | while read -r f; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || { echo "::error file=$f::invalid JSON"; exit 1; }
          done

      - name: Syntax-check workflow scripts
        run: |
          set -e
          for f in plugins/singularity/workflows/*.js plugins/singularity/templates/project/.claude/workflows/*.js.example; do
            node -e "new Function('agent','pipeline','parallel','phase','log','args','workflow','budget','return (async()=>{'+require('fs').readFileSync('$f','utf8').replace('export const meta','const meta')+'})()')" \
              || { echo "::error file=$f::syntax error"; exit 1; }
          done

      - name: Validate plugin manifests
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate --strict .
          claude plugin validate --strict ./plugins/singularity

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: warning

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          # Templates are linted with markdownlint's defaults (plugins/singularity/templates/.markdownlint-cli2.yaml),
          # including the agent examples that projects rename to .md.
          globs: |
            **/*.md
            plugins/singularity/templates/**/*.md.example

      - name: Lint YAML
        run: pip install --quiet yamllint && yamllint -s .

      - name: Lint GitHub Actions workflows
        uses: raven-actions/actionlint@v2

  evals:
    name: Eval cases load
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate eval suite structure (no model calls)
        run: node scripts/check-evals.js

  tracker-files:
    name: Task tracker script
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Run the task-file script tests (bash 5 on Linux, /bin/bash 3.2 on macOS)
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            /bin/bash --version | head -n 1
            /bin/bash tests/tracker-files.test.sh
          else
            bash tests/tracker-files.test.sh
          fi
      - name: Run the init-project git-ignore tests
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            /bin/bash tests/init-gitignore.test.sh
          else
            bash tests/init-gitignore.test.sh
          fi
      - name: Run the guideline check tests
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            /bin/bash tests/check-guidelines.test.sh
          else
            bash tests/check-guidelines.test.sh
          fi
      - name: Run the user-correction capture tests
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            /bin/bash tests/corrections.test.sh
          else
            bash tests/corrections.test.sh
          fi
      - name: Run the command guard tests
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            /bin/bash tests/guard-bash.test.sh
          else
            bash tests/guard-bash.test.sh
          fi
      - name: Run the checks, stop gate, test guard, change diff, outcomes and run record tests
        run: |
          for t in tests/run-checks.test.sh tests/test-guard.test.sh tests/change-diff.test.sh tests/outcomes.test.sh tests/run-record.test.sh; do
            if [ "$RUNNER_OS" = "macOS" ]; then /bin/bash "$t"; else bash "$t"; fi || exit 1
          done

  version:
    name: Version and changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check the plugin version and changelog
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # On pull requests, also check that the version only increases and that plugin changes add a changelog line.
          if [ -n "$BASE_REF" ]; then
            node scripts/version.js check --base "origin/$BASE_REF"
          else
            node scripts/version.js check
          fi
