name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate JSON
        run: |
          set -e
          git ls-files '*.json' | while read -r f; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || { echo "::error file=$f::invalid JSON"; exit 1; }
          done

      - name: Syntax-check workflow scripts
        run: |
          set -e
          for f in plugins/singularity/workflows/*.js plugins/singularity/templates/project/.claude/workflows/*.js.example; do
            node -e "new Function('agent','pipeline','parallel','phase','log','args','workflow','budget','return (async()=>{'+require('fs').readFileSync('$f','utf8').replace('export const meta','const meta')+'})()')" \
              || { echo "::error file=$f::syntax error"; exit 1; }
          done

      - name: Validate plugin manifests
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate --strict .
          claude plugin validate --strict ./plugins/singularity

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: warning

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: '**/*.md'

      - name: Lint YAML
        run: pip install --quiet yamllint && yamllint -s .

      - name: Lint GitHub Actions workflows
        uses: raven-actions/actionlint@v2

  evals:
    name: Eval cases load
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate eval suite structure (no model calls)
        run: node scripts/check-evals.js

  version:
    name: Version and changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check the plugin version and changelog
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # On pull requests, also check that the version only increases and that plugin changes add a changelog line.
          if [ -n "$BASE_REF" ]; then
            node scripts/version.js check --base "origin/$BASE_REF"
          else
            node scripts/version.js check
          fi
